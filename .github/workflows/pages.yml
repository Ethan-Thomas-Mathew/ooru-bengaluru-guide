# Publishes the demo to GitHub Pages on every push to main:
#   https://ethan-thomas-mathew.github.io/ooru-bengaluru-guide/
# GitHub Pages only serves files, so the demo has no Express server:
# reviews and admin are turned off (VITE_DEMO=1) and the site uses the
# data built into it.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an older one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DEMO: '1'
      # Pages has no "send every page to index.html" setting, but it shows
      # 404.html for unknown paths. A copy of index.html makes links like
      # /ooru-bengaluru-guide/plan work when opened directly.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
